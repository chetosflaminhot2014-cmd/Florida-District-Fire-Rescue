name: Build Fire Department Simulator (Windows + Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.gd"
      - "main.tscn"
      - "project.godot"
      - "dispatch_system.gd"
      - "export_presets.cfg"
      - ".github/workflows/build-game.yml"

permissions:
  contents: write

jobs:
  prepare-city-assets:
    name: Import CC0 Florida city models
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download compact textured building models
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="assets/florida_city"
          mkdir -p "$ASSET_DIR/Textures"
          BASE="https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/main/buildings/kenney-city-kit-suburban/Models/GLB%20format"
          for type in a b c d e f g h; do
            curl -L --fail --retry 3 "$BASE/building-type-$type.glb" -o "$ASSET_DIR/building-type-$type.glb"
          done
          curl -L --fail --retry 3 "$BASE/Textures/colormap.png" -o "$ASSET_DIR/Textures/colormap.png"
          # Commercial district: low-poly mid-rises and skyscrapers from Kenney City Kit Commercial (CC0).
          COMMERCIAL_DIR="$ASSET_DIR/commercial"
          mkdir -p "$COMMERCIAL_DIR/Textures"
          COMMERCIAL_BASE="https://raw.githubusercontent.com/bevyengine/bevy_asset_files/main/kenney/city-kit-commercial"
          for type in a b c d f g h l m; do
            curl -L --fail --retry 3 "$COMMERCIAL_BASE/building-$type.glb" -o "$COMMERCIAL_DIR/building-$type.glb"
          done
          for type in a b c d e; do
            curl -L --fail --retry 3 "$COMMERCIAL_BASE/building-skyscraper-$type.glb" -o "$COMMERCIAL_DIR/building-skyscraper-$type.glb"
          done
          curl -L --fail --retry 3 "$COMMERCIAL_BASE/Textures/colormap.png" -o "$COMMERCIAL_DIR/Textures/colormap.png"
          cat > "$ASSET_DIR/ASSET_LICENSES.md" <<'EOF'
          # Florida City Models — Asset Record

          - Models: Kenney City Kit (Suburban), selected GLB models building-type-a through building-type-h.
          - Texture: Kenney colormap.png.
          - License: CC0 1.0 Universal, as stated by the original Kenney asset page and the included License.txt.
          - Original asset page: https://kenney.nl/assets/city-kit-suburban
          - Godot format: GLB.

          ## Downtown commercial buildings
          - Files: assets/florida_city/commercial/building-a/b/c/d/f/g/h/l/m.glb and building-skyscraper-a through building-skyscraper-e.glb.
          - Source: Kenney City Kit (Commercial), mirrored at https://github.com/bevyengine/bevy_asset_files/tree/main/kenney/city-kit-commercial
          - License: CC0 1.0 Universal. Original asset page: https://kenney.nl/assets/city-kit-commercial
          - Texture: commercial/Textures/colormap.png.
          EOF
          VEHICLE_DIR="assets/vehicles"
          ROLE_DIR="assets/characters"
          mkdir -p "$VEHICLE_DIR" "$ROLE_DIR"
          VEHICLE_BASE="https://raw.githubusercontent.com/shorepine/kenney/main/3d/car"
          for model in police ambulance firetruck sedan suv; do
            curl -L --fail --retry 3 "$VEHICLE_BASE/$model.glb" -o "$VEHICLE_DIR/$model.glb"
          done
          curl -L --fail --retry 3 "https://www.innerscene.com/api/library/police-officer-standing-3d-person-emergency-services-9fd93114/download" -o "$ROLE_DIR/police-officer.glb"
          curl -L --fail --retry 3 "https://www.innerscene.com/api/library/firefighter-standing-3d-person-emergency-services-3c007c1f/download" -o "$ROLE_DIR/firefighter.glb"
          curl -L --fail --retry 3 "https://www.innerscene.com/api/library/drew-3d-person-paramedic-with-response-bag-c90b16a3/download" -o "$ROLE_DIR/paramedic.glb"
          curl -L --fail --retry 3 "https://www.innerscene.com/api/library/low-poly-character-worker-male-carrying-static-8a160412/download" -o "$ROLE_DIR/civilian-male.glb"
          curl -L --fail --retry 3 "https://www.innerscene.com/api/library/low-poly-character-casual-female-walking-static-befaef7b/download" -o "$ROLE_DIR/civilian-female.glb"
          cat > "$ROLE_DIR/ASSET_LICENSES.md" <<'EOF'
          # Emergency vehicles and personnel — Asset Record

          ## Vehicles
          - Files: police.glb, ambulance.glb, firetruck.glb, sedan.glb, suv.glb.
          - Source: Kenney Car Kit, mirrored at https://github.com/shorepine/kenney/tree/main/3d/car
          - License: CC0 1.0 Universal. Original pack page: https://kenney.nl/assets/car-kit
          - Published model sizes: approximately 1.0 MB combined for these five GLBs.
          - Style: optimized low-poly models, suitable for real-time use.

          ## Personnel
          - police-officer.glb: Innerscene, 16.0 MB, static mesh, approx. 123k triangles.
          - firefighter.glb: Innerscene, 19.5 MB, static mesh, approx. 91k triangles.
          - paramedic.glb: Innerscene, 14.5 MB, static mesh.
          - civilian-male.glb: Innerscene, 123 KB, low-poly male pedestrian in a natural carrying pose.
          - civilian-female.glb: Innerscene, 82 KB, low-poly casual female in a walking pose.
          - License: CC0 public domain, as stated on each model's source page.
          - Sources:
            - https://www.innerscene.com/tools/library/3d-parts/police-officer-standing-3d-person-emergency-services-9fd93114
            - https://www.innerscene.com/tools/library/3d-parts/firefighter-standing-3d-person-emergency-services-3c007c1f
            - https://www.innerscene.com/tools/library/3d-parts/drew-3d-person-paramedic-with-response-bag-c90b16a3
            - https://www.innerscene.com/tools/library/3d-parts/low-poly-character-worker-male-carrying-static-8a160412
            - https://www.innerscene.com/tools/library/3d-parts/low-poly-character-casual-female-walking-static-befaef7b
          - Police, firefighter and paramedic GLBs are detailed static meshes; they do not include walk animations.
          - Civilian GLBs are lightweight and are selected per NPC; models/officer.obj remains the existing sheriff-specific 3D mesh because a suitable free CC0 sheriff-uniform GLB was not verified.
          EOF
          cat > "$ROLE_DIR/ASSET_SIZES.txt" <<'EOF'
          Vehicle GLB sizes in the source mirror: police 195336 B; ambulance 233612 B; firetruck 232448 B; sedan 172216 B; suv 207572 B.
          Personnel model sizes from the source pages: police officer 16.0 MB; firefighter 19.5 MB; paramedic 14.5 MB; civilian male 104 KB; civilian female 82 KB.
          EOF
      - name: Commit downloaded assets into the repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/florida_city assets/vehicles assets/characters
          if git diff --cached --quiet; then
            echo "City, vehicle, civilian and emergency personnel assets are already present."
          else
            git commit -m "Add CC0 emergency vehicles and responder models"
            git push origin HEAD:main
          fi

  windows:
    needs: prepare-city-assets
    name: Export Windows PC build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout latest main (includes imported city assets)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a script import or parse error."
            exit 1
          fi
          "$GODOT_BIN" --headless --path . --quit-after 8 -- --smoke-test 2>&1 | tee /tmp/godot-startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-startup.log; then
            echo "Godot reported a runtime startup script error."
            exit 1
          fi
      - name: Export Windows build
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Windows Desktop" build/FireDepartmentSimulator.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FireDepartmentSimulator-Windows-PC
          path: build/FireDepartmentSimulator.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Export Android APK
    needs: prepare-city-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout latest main (includes imported city assets)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK and NDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"
      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" "$HOME/.config/godot"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a script import or parse error."
            exit 1
          fi
          "$GODOT_BIN" --headless --path . --quit-after 8 -- --smoke-test 2>&1 | tee /tmp/godot-startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-startup.log; then
            echo "Godot reported a runtime startup script error."
            exit 1
          fi
      - name: Export Android APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/FireDepartmentSimulator.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FireDepartmentSimulator-Android-APK
          path: build/FireDepartmentSimulator.apk
          if-no-files-found: error
          retention-days: 14
