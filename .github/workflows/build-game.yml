name: Build Police Officer Simulator (PC + Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.gd"
      - "main.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/build-game.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Export Windows PC build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a script import or parse error."
            exit 1
          fi
          "$GODOT_BIN" --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-startup.log; then
            echo "Godot reported a runtime startup script error."
            exit 1
          fi
      - name: Export Windows build
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Windows Desktop" build/PoliceOfficerSimulator.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PoliceOfficerSimulator-Windows-PC
          path: build/PoliceOfficerSimulator.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK and NDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"
      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" "$HOME/.config/godot"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a script import or parse error."
            exit 1
          fi
          "$GODOT_BIN" --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-startup.log; then
            echo "Godot reported a runtime startup script error."
            exit 1
          fi
      - name: Export Android APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/PoliceOfficerSimulator.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PoliceOfficerSimulator-Android-APK
          path: build/PoliceOfficerSimulator.apk
          if-no-files-found: error
          retention-days: 14
