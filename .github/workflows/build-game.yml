name: Build Police Officer Simulator (PC + Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.gd"
      - "main.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - "*.glb"
      - "models/**"
      - "assets/florida_city/**"
      - ".github/workflows/build-game.yml"

permissions:
  contents: write

jobs:
  prepare-city-assets:
    name: Import CC0 Florida city models
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download compact textured building models
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="assets/florida_city"
          mkdir -p "$ASSET_DIR/Textures"
          BASE="https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/main/buildings/kenney-city-kit-suburban/Models/GLB%20format"
          for type in a b c d e f g h; do
            curl -L --fail --retry 3 "$BASE/building-type-$type.glb" -o "$ASSET_DIR/building-type-$type.glb"
          done
          curl -L --fail --retry 3 "$BASE/Textures/colormap.png" -o "$ASSET_DIR/Textures/colormap.png"
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/main/buildings/kenney-city-kit-suburban/License.txt" -o "$ASSET_DIR/License.txt"
          cat > "$ASSET_DIR/ASSET_LICENSES.md" <<'EOF'
          # Florida City Models — Asset Record

          - Models: Kenney City Kit (Suburban), selected GLB models building-type-a through building-type-h.
          - Texture: Kenney colormap.png.
          - License: CC0 1.0 Universal, as stated by the original Kenney asset page and the included License.txt.
          - Original asset page: https://kenney.nl/assets/city-kit-suburban
          - Mirror used by CI for reproducible downloads: https://github.com/petroulacl/fps-buildings-env-kit
          - Godot format: glTF Binary (.glb), loaded by Godot 4 without an additional importer.
          - Size: the eight GLB files total under 1 MB based on the mirror's published Git object sizes; the shared texture is about 12 KB.
          - Visual note: these are optimized, textured, stylized low-poly buildings—not photorealistic scans. The game uses them as real mesh facades rather than generating building-shaped cubes.
          EOF
      - name: Commit downloaded assets into the repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/florida_city
          if git diff --cached --quiet; then
            echo "Florida city assets are already present."
          else
            git commit -m "Add CC0 textured Florida city building models"
            git push origin HEAD:main
          fi

  windows:
    needs: prepare-city-assets
    name: Export Windows PC build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout latest main (includes imported city assets)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a script import or parse error."
            exit 1
          fi
          "$GODOT_BIN" --headless --path . --quit-after 8 -- --smoke-test 2>&1 | tee /tmp/godot-startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-startup.log; then
            echo "Godot reported a runtime startup script error."
            exit 1
          fi
      - name: Export Windows build
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Windows Desktop" build/PoliceOfficerSimulator.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PoliceOfficerSimulator-Windows-PC
          path: build/PoliceOfficerSimulator.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Export Android APK
    needs: prepare-city-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout latest main (includes imported city assets)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK and NDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"
      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" "$HOME/.config/godot"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a script import or parse error."
            exit 1
          fi
          "$GODOT_BIN" --headless --path . --quit-after 8 -- --smoke-test 2>&1 | tee /tmp/godot-startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-startup.log; then
            echo "Godot reported a runtime startup script error."
            exit 1
          fi
      - name: Export Android APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/PoliceOfficerSimulator.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PoliceOfficerSimulator-Android-APK
          path: build/PoliceOfficerSimulator.apk
          if-no-files-found: error
          retention-days: 14
